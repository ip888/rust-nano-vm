# Dependabot — weekly dependency updates across every ecosystem
# this repo touches. PRs auto-merge on green CI via the
# `dependabot-auto-merge.yml` workflow.
#
# Cadence is weekly on Monday morning UTC so the operator sees a
# single grouped PR set at the start of the week instead of a
# trickle every day.
#
# Grouping: minor + patch updates get grouped per ecosystem into a
# single PR so 20 minor bumps don't fan out as 20 PRs. Major bumps
# stay separate for individual attention (they usually need a
# migration).

version: 2
updates:
  # ---- Rust workspace ----------------------------------------------------
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, cargo]
    ignore:
      # vm-memory + linux-loader are a coupled pin, NOT a coupled
      # major-migration only. `linux-loader = "0.13.2"` declares
      # `vm-memory >=0.16, <=0.17.1` in its public dep — any bump
      # above 0.17.1 (even a patch like 0.17.1 → 0.17.2) makes Cargo
      # resolve two versions of vm-memory in the same build and the
      # KVM backend fails to compile. We were bitten by exactly this
      # in PR #261 (Dependabot bumped =0.17.1 to =0.17.2 within
      # the group PR) and had to revert.
      #
      # Both crates stay fully ignored here until the coordinated
      # vm-memory 0.18 + linux-loader 0.14 migration lands (bigger
      # patch: ~8 API sites in vm-kvm/src/lib.rs for the GuestMemory
      # reshape, plus `boot_e820_entry.type_` → `r#type` rename in
      # regenerated bindings).
      - dependency-name: vm-memory
      - dependency-name: linux-loader
      # axum 0.8 changed `Sse::keep_alive()` return type (now wraps
      # `KeepAliveStream<S>`) and swapped the route-matcher syntax from
      # `:name` to `{name}` — needs a coordinated migration across
      # `crates/control-plane/src/routes.rs` and `exec_stream.rs`.
      - dependency-name: axum
        update-types: [version-update:semver-major]

  # ---- GitHub Actions themselves -----------------------------------------
  # actions/checkout@v4 → v5 etc — quiet security work that keeps CI on
  # supported action versions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, github-actions]

  # ---- Dockerfile bases --------------------------------------------------
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
