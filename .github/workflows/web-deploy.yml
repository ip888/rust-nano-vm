name: web-deploy

# Deploys the nanovm-web Next.js site to Fly.io on every push to
# main that touches `web/**`, `Dockerfile.web`, or `fly.toml`.
# Skipped for docs-only changes elsewhere in the repo.
#
# One-time setup (do NOT commit these):
#   1. flyctl auth token  → paste as GitHub secret `FLY_API_TOKEN`.
#   2. Domain: `fly certs create nanovm.io` (and any subdomains).
#      DNS: point A / AAAA of nanovm.io at Fly's shared IPs, or
#      allocate a dedicated one via `fly ips allocate-v4`.
#
# PR builds run typecheck + `next build` but do NOT deploy. Merge to
# main → deploy.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "Dockerfile.web"
      - "fly.toml"
      - ".github/workflows/web-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "Dockerfile.web"
      - "fly.toml"

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR + push: build + typecheck. Confirms the site compiles before
  # the deploy step touches Fly.io. Fast (~90 s cold, ~30 s cached).
  build:
    name: build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: typecheck
        working-directory: web
        run: npm run typecheck
      - name: build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # Push-to-main only: hand the build off to Fly.io's remote builder
  # which redoes the Docker build (image cache lives there so it's
  # faster than shipping a local image up) and rolls the deploy.
  deploy:
    name: fly deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          # `--remote-only` avoids uploading the build context from
          # this GH runner — Fly's builder pulls the repo and builds
          # in its own environment.
          flyctl deploy --remote-only \
              --dockerfile Dockerfile.web \
              --config fly.toml
