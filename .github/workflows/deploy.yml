name: deploy

# Zero-touch continuous deployment: every merge to main runs the
# test suite, then (if green) deploys the web tier to Vercel and
# the control plane to Fly.io. Post-deploy smoke tests re-verify
# the live surface; a failure at any step leaves the previous
# version live and surfaces via the standard GitHub Actions
# notification channel.
#
# Manual re-deploy: `gh workflow run deploy.yml`.
#
# What this workflow does NOT do (by design):
#   - Ship the SDKs — that's `python-publish.yml` + `npm-publish.yml`
#     on `v*.*.*` tag pushes, unchanged.
#   - Change Stripe / Cloudflare / DNS state — those are one-time
#     `scripts/launch/*.sh` runs; changing them from CI would let a
#     bad merge nuke production billing.
#
# Required repository secrets (set once via
# `gh secret set` — see docs/autonomous-ops.md):
#   FLY_API_TOKEN          — from `flyctl auth token`
#   VERCEL_TOKEN           — from vercel.com/account/tokens
#   VERCEL_ORG_ID          — from vercel.com/<org>/settings
#   VERCEL_PROJECT_ID      — from web/.vercel/project.json after first deploy
#
# Required repository variables (public — set via `gh variable set`):
#   NANOVM_FLY_APP         — Fly app name, default nanovm-control-plane-prod
#   NANOVM_DOMAIN          — apex domain used by the smoke test
#   NANOVM_API_DOMAIN      — api subdomain used by the smoke test

on:
  push:
    branches: [main]
  # Manual re-deploy from the Actions tab or CLI.
  workflow_dispatch:

# Cancel superseded runs so a rapid burst of merges doesn't queue up
# obsolete deploys.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- gate: unit + integration tests ------------------------------------

  test:
    name: test (rust + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Rust toolchain
        run: rustup show

      - name: Rust — build workspace
        run: cargo build --workspace

      - name: Rust — test (mock backend; KVM tests are feature-gated)
        run: cargo test --workspace

      - name: Rust — clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust — fmt
        run: cargo fmt --all -- --check

      - name: Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            clients/typescript/package-lock.json

      - name: Web — typecheck + build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: TS SDK — typecheck + test
        working-directory: clients/typescript
        run: |
          npm ci
          npm run typecheck
          npm run test

  # ---- deploy: web to Vercel + control plane to Fly.io -------------------
  #
  # The two happen in parallel — no cross-dependency. If either
  # deploy step fails, the previous version keeps serving (Fly
  # rollback via `flyctl releases`, Vercel via automatic previous-
  # deploy retention).

  deploy-web:
    name: deploy web → Vercel
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production-web
      url: https://${{ vars.NANOVM_DOMAIN }}
    steps:
      - uses: actions/checkout@v7

      - name: Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project config
        working-directory: web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build (Vercel prebuild)
        working-directory: web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy (prebuilt)
        working-directory: web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --prebuilt --prod \
              --token="${{ secrets.VERCEL_TOKEN }}" \
              > /tmp/deploy-url.txt
          echo "deployed to: $(cat /tmp/deploy-url.txt)"

  deploy-control-plane:
    name: deploy control plane → Fly.io
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production-api
      url: https://${{ vars.NANOVM_API_DOMAIN }}/healthz
    steps:
      - uses: actions/checkout@v7

      - name: flyctl
        # Pinned by SHA (v1.5) so a compromised `master` on the action
        # cannot exfiltrate `FLY_API_TOKEN`. Dependabot bumps this
        # alongside the other github-actions ecosystem entries.
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.NANOVM_FLY_APP }}
        run: |
          set -euo pipefail
          # Generate a production fly.toml from the live-demo template
          # with the SaaS app name, region, and the persistent-volume
          # mount that scripts/launch/fly-deploy.sh also plants. Fly
          # rejects a deploy that omits the volume the app already
          # carries, so the mount must be in this manifest.
          FLY_MANIFEST=".fly.toml.generated"
          sed -e "s/^app = .*/app = \"${FLY_APP}\"/" \
              -e "s/^primary_region = .*/primary_region = \"${NANOVM_FLY_REGION:-iad}\"/" \
              deploy/live-demo/fly/fly.toml > "${FLY_MANIFEST}"
          if ! grep -q "^\[mounts\]" "${FLY_MANIFEST}"; then
            printf '\n[mounts]\n  source = "nanovm_snapshots"\n  destination = "/data"\n' \
                >> "${FLY_MANIFEST}"
          fi
          # Pin to the KVM image the sibling docker.yml workflow
          # publishes on the same commit. `edge` is main's continuous
          # channel; `latest` is the last tag. Try commit-SHA first for
          # precise per-merge tracing, then fall back so a still-
          # running docker build doesn't block the deploy.
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nanovm-control-plane-kvm"
          for tag in "${GITHUB_SHA}" "edge" "latest"; do
            IMAGE="${IMAGE_REPO}:${tag}"
            echo "trying image: ${IMAGE}"
            if flyctl deploy \
                -a "${FLY_APP}" \
                -c "${FLY_MANIFEST}" \
                --image "${IMAGE}" \
                --strategy rolling \
                --wait-timeout 600; then
              echo "deployed ${IMAGE}"
              exit 0
            fi
            echo "  ↳ ${IMAGE} not deployable, trying next tag"
          done
          echo "::error::no deployable image found in ${IMAGE_REPO}" >&2
          exit 1

  # ---- post-deploy: smoke test the live surface --------------------------
  #
  # A failure here doesn't automatically roll back (Vercel + Fly already
  # did the primary rollback if the deploy step failed) but does mark
  # the run red so the operator investigates. In practice this catches
  # deploy-succeeded-but-CORS-is-wrong and similar cross-service
  # config drift.

  smoke:
    name: smoke test live surface
    needs: [deploy-web, deploy-control-plane]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Wait for DNS + edge propagation
        # Vercel deploys serve globally in ~5 s; Fly.io machine
        # rolling deploys can take up to 60 s. Give the whole thing
        # a minute before we start smoke-testing.
        run: sleep 60

      - name: Marketing routes
        env:
          DOMAIN: ${{ vars.NANOVM_DOMAIN }}
        run: |
          set -euo pipefail
          for path in "" /pricing /why-nanovm /marketplace /signup /sitemap.xml /robots.txt /rss.xml; do
            url="https://${DOMAIN}${path}"
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --location "${url}")"
            if [[ "${status}" != "200" ]]; then
              echo "::error::${url} returned ${status}"
              exit 1
            fi
            echo "  ✓ ${url}  200"
          done

      - name: Control-plane health
        env:
          API_DOMAIN: ${{ vars.NANOVM_API_DOMAIN }}
        run: |
          set -euo pipefail
          # /healthz is the unauthenticated liveness probe. /v1/health
          # is behind the bearer-token auth middleware and would return
          # 401 to an anonymous smoke run. /openapi.json and /metrics
          # are also outside the /v1/* auth scope.
          for path in /healthz /openapi.json /metrics; do
            url="https://${API_DOMAIN}${path}"
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --location "${url}")"
            if [[ "${status}" != "200" ]]; then
              echo "::error::${url} returned ${status}"
              exit 1
            fi
            echo "  ✓ ${url}  200"
          done
